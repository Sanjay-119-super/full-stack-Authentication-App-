# Development version of Config
server:
  port: 8083

# Database connection mysql
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auth_app
    username: root
    password: YourStrongPassword

    hikari:
      #Connection pool size
      maximum-idle: 5
      maximum-pool-size: 20
      #Connection pool size
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 60000
      # pool identity
      pool-name: AuthAppHikari
      auto-commit: true
      #Health Check
      connection-test-query: SELECT 1


  # JPA & Hibernate configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

logging:
  level:
    org.springframework.security: DEBUG

security:
  jwt:
    secret: "a769d60ca0ee4ece7b191702f987015c2c4cb639c5a25380c068d7dfbd5fbf61"
    issuer: "sanjay-dev-app"

    access-ttl-seconds: 900        # 15 min
    refresh-ttl-seconds: 604800    # 7 days

    refresh-token-cookie-name: "refreshToken"

    cookie-secure: true          # dev me HTTP allowed
    cookie-http-only: true        # JS access nahi karega
    cookie-same-site: "Lax"       # CSRF protection level
    cookie-domain: "localhost"       # CSRF protection level